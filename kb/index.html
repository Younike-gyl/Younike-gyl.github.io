<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 - Younike</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; }

.app { display: flex; height: 100vh; width: 100vw; }

/* ===== 左侧文章列表 ===== */
.sidebar {
  width: 280px;
  min-width: 280px;
  height: 100vh;
  background: #ffffff;
  border-right: 1px solid #e8e8ee;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 18px 20px;
  border-bottom: 1px solid #f0f0f5;
}

.sidebar-header h3 {
  font-size: 16px;
  font-weight: 600;
  color: #1e1e2d;
  margin-bottom: 4px;
}

.sidebar-header p {
  font-size: 12px;
  color: #a0a1b2;
}

/* 分组 */
.article-group { border-bottom: 1px solid #f0f0f5; }

.group-header {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: #555770;
  gap: 8px;
  transition: all 0.15s;
  user-select: none;
}

.group-header:hover { background: #f5f6fa; }

.group-header .arrow {
  font-size: 10px;
  transition: transform 0.2s;
  color: #a0a1b2;
}

.group-header.collapsed .arrow { transform: rotate(-90deg); }

.group-count {
  margin-left: auto;
  font-size: 11px;
  color: #a0a1b2;
  font-weight: 400;
}

.group-articles {
  list-style: none;
  overflow: hidden;
  transition: max-height 0.25s ease;
}

.group-articles.collapsed { max-height: 0 !important; }

.article-item {
  padding: 9px 20px 9px 44px;
  cursor: pointer;
  font-size: 13px;
  color: #555770;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.article-item:hover { background: #f0f2ff; color: #333350; }

.article-item.active {
  background: #f0f2ff;
  color: #667eea;
  border-left-color: #667eea;
  font-weight: 500;
}

/* 滚动文章列表 */
.article-scroll {
  flex: 1;
  overflow-y: auto;
}

/* ===== 右侧内容区 ===== */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: #f5f6fa;
  overflow: hidden;
}

/* 面包屑 */
.breadcrumb-bar {
  height: 44px;
  min-height: 44px;
  background: #ffffff;
  border-bottom: 1px solid #e8e8ee;
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-size: 13px;
  color: #a0a1b2;
  gap: 6px;
  user-select: none;
}

.breadcrumb-bar .sep { color: #d0d1d8; }

.breadcrumb-bar .current {
  color: #1e1e2d;
  font-weight: 500;
}

/* 内容渲染区 */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px;
  background: #ffffff;
  margin: 0 auto;
  width: 100%;
  max-width: 920px;
}

/* 空状态 */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #c0c1d4;
}

.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* 加载提示 */
.loading {
  text-align: center;
  color: #a0a1b2;
  padding: 40px;
  font-size: 14px;
}

/* ===== Markdown 渲染样式 ===== */
.markdown-body { line-height: 1.8; color: #333350; }

.markdown-body h1 {
  font-size: 26px;
  font-weight: 700;
  color: #1e1e2d;
  margin-bottom: 8px;
  padding-bottom: 12px;
  border-bottom: 2px solid #e8e8ee;
}

.markdown-body h2 {
  font-size: 20px;
  font-weight: 600;
  color: #1e1e2d;
  margin-top: 32px;
  margin-bottom: 12px;
}

.markdown-body h3 {
  font-size: 16px;
  font-weight: 600;
  color: #333350;
  margin-top: 24px;
  margin-bottom: 8px;
}

.markdown-body p { margin-bottom: 12px; }

.markdown-body ul, .markdown-body ol {
  margin-bottom: 12px;
  padding-left: 24px;
}

.markdown-body li { margin-bottom: 4px; }

.markdown-body strong { color: #1e1e2d; }

.markdown-body blockquote {
  margin: 16px 0;
  padding: 12px 16px;
  border-left: 4px solid #667eea;
  background: #f5f6ff;
  color: #555770;
  font-size: 14px;
}

.markdown-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 14px;
}

.markdown-body th, .markdown-body td {
  padding: 10px 14px;
  border: 1px solid #e8e8ee;
  text-align: left;
}

.markdown-body th {
  background: #f5f6fa;
  font-weight: 600;
  color: #555770;
}

.markdown-body tr:hover td { background: #fafafe; }

.markdown-body code {
  font-family: "SF Mono", "Consolas", "Menlo", monospace;
  font-size: 13px;
  background: #f5f5fa;
  padding: 2px 6px;
  border-radius: 3px;
  color: #667eea;
}

.markdown-body pre {
  background: #1e1e2d;
  color: #c0c1d4;
  padding: 16px 20px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 16px 0;
  font-size: 13px;
  line-height: 1.6;
}

.markdown-body pre code {
  background: none;
  color: inherit;
  padding: 0;
}

.markdown-body hr {
  border: none;
  border-top: 1px solid #e8e8ee;
  margin: 32px 0;
}

.markdown-body em { color: #8a8b9f; }

/* 响应式 */
@media (max-width: 768px) {
  .sidebar { width: 220px; min-width: 220px; }
  .content-area { padding: 20px 24px; }
}
</style>
</head>
<body>

<div class="app">

  <!-- 左侧文章列表 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3>知识库</h3>
      <p>供应链 &amp; 工作技巧</p>
    </div>

    <div class="article-scroll" id="articleScroll"></div>

    <div style="padding:12px 20px;font-size:11px;color:#c0c1d4;border-top:1px solid #f0f0f5;text-align:center;">
      共 <span id="totalCount">0</span> 篇文章
    </div>
  </aside>

  <!-- 右侧内容区 -->
  <main class="main-area">
    <div class="breadcrumb-bar" id="breadcrumb">
      <span>知识库</span>
      <span class="sep">/</span>
      <span class="current" id="breadGroup">-</span>
      <span class="sep">/</span>
      <span class="current" id="breadArticle">-</span>
    </div>

    <div class="content-area" id="contentArea">
      <div class="empty-state">
        <div class="icon">📖</div>
        <p>请从左侧选择文章</p>
      </div>
    </div>
  </main>

</div>

<script>
// ========== 文章配置 ==========
const articleTree = [
  {
    group: '流程管理',
    articles: [
      { name: '收货入库流程', file: 'process/01-receiving-flow.md' }
    ]
  },
  {
    group: '成本管理',
    articles: [
      { name: '月度成本分析模板', file: 'cost/01-monthly-cost.md' }
    ]
  },
  {
    group: '时效管理',
    articles: [
      { name: '订单时效管控表', file: 'time/01-order-timeline.md' }
    ]
  },
  {
    group: '工作技巧',
    articles: [
      { name: 'Excel常用函数速查', file: 'tips/01-excel-functions.md' }
    ]
  }
];

const KB_BASE = window.location.pathname.replace(/\/[^/]*$/, '') || '.';

let activeArticleEl = null;
let activeGroupEl = null;

// ========== 初始化 ==========
function init() {
  // 计算总数
  let total = 0;
  articleTree.forEach(g => total += g.articles.length);
  document.getElementById('totalCount').textContent = total;

  // 渲染文章列表
  const scroll = document.getElementById('articleScroll');
  articleTree.forEach((group, gi) => {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'article-group';

    const header = document.createElement('div');
    header.className = 'group-header';
    header.innerHTML = `<span class="arrow">▼</span>${group.group}<span class="group-count">${group.articles.length} 篇</span>`;
    header.addEventListener('click', () => toggleGroup(header));

    const ul = document.createElement('ul');
    ul.className = 'group-articles';
    ul.style.maxHeight = '200px';

    group.articles.forEach((article, ai) => {
      const li = document.createElement('li');
      li.className = 'article-item';
      li.textContent = article.name;
      li.dataset.groupIdx = gi;
      li.dataset.articleIdx = ai;
      li.addEventListener('click', () => loadArticle(gi, ai, li, header));
      ul.appendChild(li);
    });

    groupDiv.appendChild(header);
    groupDiv.appendChild(ul);
    scroll.appendChild(groupDiv);
  });

  // 加载默认文章（URL hash 或第一篇）
  const hash = decodeURIComponent(window.location.hash.replace('#', ''));
  let found = false;
  if (hash) {
    for (let gi = 0; gi < articleTree.length; gi++) {
      for (let ai = 0; ai < articleTree[gi].articles.length; ai++) {
        if (articleTree[gi].group === hash) {
          const scrollEl = document.getElementById('articleScroll');
          const items = scrollEl.querySelectorAll('.article-item');
          let idx = 0;
          for (let g = 0; g < gi; g++) idx += articleTree[g].articles.length;
          const target = items[idx + ai];
          const groupHeader = target.closest('.article-group').querySelector('.group-header');
          loadArticle(gi, ai, target, groupHeader);
          target.scrollIntoView({ block: 'nearest' });
          found = true;
          break;
        }
      }
      if (found) break;
    }
  }
  if (!found) {
    const firstItem = document.querySelector('.article-item');
    if (firstItem) firstItem.click();
  }
}

function toggleGroup(header) {
  header.classList.toggle('collapsed');
  const ul = header.nextElementSibling;
  ul.classList.toggle('collapsed');
}

function loadArticle(gi, ai, el, groupHeader) {
  const group = articleTree[gi];
  const article = group.articles[ai];

  // 更新激活状态
  if (activeArticleEl) activeArticleEl.classList.remove('active');
  el.classList.add('active');
  activeArticleEl = el;

  // 面包屑
  document.getElementById('breadGroup').textContent = group.group;
  document.getElementById('breadArticle').textContent = article.name;
  document.title = article.name + ' - 知识库';

  // 渲染内容
  const contentArea = document.getElementById('contentArea');
  contentArea.innerHTML = '<div class="loading">加载中...</div>';

  const url = KB_BASE + '/' + article.file;
  fetch(url)
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(md => {
      const html = marked.parse(md);
      contentArea.innerHTML = '<div class="markdown-body">' + html + '</div>';
    })
    .catch(err => {
      contentArea.innerHTML = '<div class="empty-state"><div class="icon">⚠</div><p>文章加载失败<br/><small>' + err.message + '</small></p></div>';
    });
}

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
