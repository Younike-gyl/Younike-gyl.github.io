<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Younike 项目导航</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

/* ===== 整体布局 ===== */
.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ===== 左侧导航栏 ===== */
.sidebar {
  width: 260px;
  min-width: 260px;
  height: 100vh;
  background: #1e1e2d;
  color: #a2a3b7;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  user-select: none;
}

/* 侧边栏头部 */
.sidebar-header {
  padding: 20px 20px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #2b2b40;
}

.sidebar-header .logo {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: bold;
  color: #fff;
}

.sidebar-header h2 {
  font-size: 16px;
  font-weight: 600;
  color: #ffffff;
  white-space: nowrap;
}

/* 导航分组 */
.nav-group {
  border-bottom: 1px solid #2b2b40;
}

.nav-group-header {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: #8a8b9f;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: color 0.15s;
  gap: 8px;
}

.nav-group-header:hover {
  color: #c0c1d4;
}

.nav-group-header .arrow {
  font-size: 10px;
  transition: transform 0.2s;
  flex-shrink: 0;
}

.nav-group.collapsed .nav-group-header .arrow {
  transform: rotate(-90deg);
}

.nav-group.collapsed .nav-items {
  display: none;
}

/* 导航项 */
.nav-items {
  list-style: none;
  padding: 0 0 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  padding: 10px 20px 10px 36px;
  cursor: pointer;
  font-size: 14px;
  color: #a2a3b7;
  transition: all 0.15s;
  gap: 10px;
  border-left: 3px solid transparent;
}

.nav-item:hover {
  background: #1b1b28;
  color: #d0d1e0;
}

.nav-item.active {
  background: #1b1b28;
  color: #ffffff;
  border-left-color: #667eea;
}

.nav-item .item-icon {
  font-size: 16px;
  flex-shrink: 0;
  width: 20px;
  text-align: center;
}

.nav-item .item-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-item .item-badge {
  margin-left: auto;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 10px;
  background: rgba(102, 126, 234, 0.2);
  color: #667eea;
  white-space: nowrap;
}

/* 侧边栏底部 */
.sidebar-footer {
  margin-top: auto;
  padding: 16px 20px;
  font-size: 12px;
  color: #5a5b72;
  border-top: 1px solid #2b2b40;
  text-align: center;
}

/* ===== 右侧内容区 ===== */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: #f5f6fa;
}

/* 顶部标题栏 */
.top-bar {
  height: 48px;
  min-height: 48px;
  background: #ffffff;
  border-bottom: 1px solid #e8e8ee;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 12px;
  z-index: 10;
}

.top-bar .breadcrumb {
  font-size: 14px;
  color: #555770;
}

.top-bar .breadcrumb span {
  color: #a0a1b2;
  margin: 0 6px;
}

.top-bar .breadcrumb .current {
  color: #1e1e2d;
  font-weight: 500;
}

/* iframe 容器 */
.iframe-container {
  flex: 1;
  position: relative;
  background: #fff;
}

.iframe-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* 空状态 */
.empty-state {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #c0c1d4;
}

.empty-state .empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.empty-state p {
  font-size: 14px;
}
</style>
</head>
<body>

<div class="app-container">

  <!-- 左侧导航栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">Y</div>
      <h2>Younike 导航</h2>
    </div>

    <!-- 生产管理分组 -->
    <div class="nav-group" id="navGroup1">
      <div class="nav-group-header" onclick="toggleGroup('navGroup1')">
        <span class="arrow">▼</span>
        <span>生产管理</span>
      </div>
      <ul class="nav-items">
        <li class="nav-item active"
            onclick="switchProject(this, 'fqc', 'https://younike-gyl.github.io/fqc-staffing/', 'FQC 人员配置预测', '生产管理')">
          <span class="item-icon">📊</span>
          <span class="item-label">FQC 人员配置预测</span>
        </li>
      </ul>
    </div>

    <!-- 更多分组可在此添加 -->
    <!--
    <div class="nav-group collapsed" id="navGroup2">
      <div class="nav-group-header" onclick="toggleGroup('navGroup2')">
        <span class="arrow">▼</span>
        <span>质量体系</span>
      </div>
      <ul class="nav-items">
        <li class="nav-item" onclick="switchProject(this, 'qa', 'https://example.com/qa/', '质量管理看板', '质量体系')">
          <span class="item-icon">✅</span>
          <span class="item-label">质量管理看板</span>
        </li>
      </ul>
    </div>
    -->

    <div class="sidebar-footer">Younike Project Hub</div>
  </aside>

  <!-- 右侧内容区 -->
  <main class="main-area">
    <div class="top-bar">
      <div class="breadcrumb" id="breadcrumb">
        <span id="breadGroup">生产管理</span>
        <span>/</span>
        <span class="current" id="breadProject">FQC 人员配置预测</span>
      </div>
    </div>

    <div class="iframe-container" id="iframeContainer">
      <iframe id="contentFrame"
              src="https://younike-gyl.github.io/fqc-staffing/"
              title="项目内容"
              sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
              allowfullscreen>
      </iframe>
    </div>
  </main>

</div>

<script>
// 当前激活的项目信息
const state = {
  activeNavItem: document.querySelector('.nav-item.active'),
  activeProjectId: 'fqc',
  iframeUrl: 'https://younike-gyl.github.io/fqc-staffing/'
};

// 项目配置列表（未来添加新项目时在这里注册）
const projects = {
  'fqc': {
    url: 'https://younike-gyl.github.io/fqc-staffing/',
    name: 'FQC 人员配置预测',
    group: '生产管理'
  }
  // 未来添加示例:
  // 'qa': {
  //   url: 'https://example.com/qa-dashboard/',
  //   name: '质量管理看板',
  //   group: '质量体系'
  // }
};

// 切换分组折叠
function toggleGroup(groupId) {
  const group = document.getElementById(groupId);
  group.classList.toggle('collapsed');
}

// 切换项目
function switchProject(el, projectId, url, name, group) {
  if (state.activeNavItem === el) return;

  // 取消上一个高亮
  if (state.activeNavItem) {
    state.activeNavItem.classList.remove('active');
  }

  // 设置新高亮
  el.classList.add('active');
  state.activeNavItem = el;
  state.activeProjectId = projectId;

  // 更新面包屑
  document.getElementById('breadGroup').textContent = group;
  document.getElementById('breadProject').textContent = name;

  // 切换 iframe
  document.getElementById('contentFrame').src = url;
  state.iframeUrl = url;

  // 更新 document title
  document.title = name + ' - Younike 项目导航';
}
</script>

</body>
</html>
